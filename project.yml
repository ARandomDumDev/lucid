name: Lucid
options:
  bundleIdPrefix: com.randomaticstudios
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Lucid:
    type: application
    platform: iOS
    sources:
      - Lucid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randomaticstudios.lucid
        PRODUCT_NAME: Lucid
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Lucid
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
